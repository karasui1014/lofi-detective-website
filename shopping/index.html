<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>おかいものメモ｜やさしいお買い物リスト</title>
  <meta name="description" content="毎日のお買い物がラクになる、可愛いお買い物リストアプリ。よく買うものはワンタップ、売り場順に自動整列、予算もひと目で。端末内保存・ログイン不要・オフライン対応。">
  <meta name="theme-color" content="#ff9bb3">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="おかいものメモ">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- ===== ヘッダー ===== -->
  <header class="app-header">
    <div class="header-top">
      <span class="mascot" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 22h26l-3 16a4 4 0 0 1-4 3.5H18a4 4 0 0 1-4-3.5L11 22z" fill="#ffd9e1" stroke="#ff9bb3" stroke-width="2"/>
          <path d="M8 22h32" stroke="#ff9bb3" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="19" cy="17" r="7" fill="#fff4ef" stroke="#caa89c" stroke-width="1.6"/>
          <path d="M13 12l-1.5-4.5 5 2.5M25 12l1.5-4.5-5 2.5" fill="#fff4ef" stroke="#caa89c" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="16.5" cy="17" r="1.2" fill="#6b5560"/><circle cx="21.5" cy="17" r="1.2" fill="#6b5560"/>
          <circle cx="14.5" cy="19.5" r="1.4" fill="#ffb3c6"/><circle cx="23.5" cy="19.5" r="1.4" fill="#ffb3c6"/>
        </svg>
      </span>
      <span class="app-title">
        <span class="ja">おかいものメモ</span>
        <span class="en">OKAIMONO MEMO</span>
      </span>
      <span class="header-spacer"></span>
      <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙️</button>
    </div>

    <!-- 予算バー -->
    <div class="budget-wrap" id="budgetWrap" role="button" tabindex="0" aria-label="予算を設定">
      <div class="budget-row">
        <span class="total" id="totalAmount">¥0</span>
        <span class="cap" id="budgetCap">予算未設定</span>
      </div>
      <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
      <div class="budget-msg" id="budgetMsg"></div>
    </div>
  </header>

  <!-- ===== いつもの ===== -->
  <section class="staples" id="staples">
    <div class="staples-label">⭐ いつもの（タップで追加）</div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- ===== ツールバー ===== -->
  <div class="toolbar">
    <div class="seg" id="sortSeg" role="tablist" aria-label="並び順">
      <button data-sort="aisle" role="tab">売り場順</button>
      <button data-sort="added" role="tab">追加順</button>
    </div>
    <span class="count" id="counter"></span>
  </div>

  <!-- ===== リスト ===== -->
  <main class="list" id="list" aria-live="polite"></main>

  <!-- ===== 下部 追加バー ===== -->
  <div class="add-bar">
    <div class="add-inner">
      <div class="suggest" id="suggest"></div>
      <form class="add-form" id="addForm" autocomplete="off">
        <input class="add-input" id="addInput" type="text" placeholder="買うものを入力…（例：牛乳）"
               enterkeyhint="done" aria-label="買うものを入力">
        <button class="add-submit" type="submit" aria-label="追加">＋</button>
      </form>
    </div>
  </div>

  <!-- ===== モーダル（編集・設定） ===== -->
  <div class="modal" id="modal">
    <div class="modal-bg" id="modalBg"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- ===== 演出レイヤー ===== -->
  <div class="reward" id="reward" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="./categories.js"></script>
  <script src="./app.js"></script>
</body>

</html>
